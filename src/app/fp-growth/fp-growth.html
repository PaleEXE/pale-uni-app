<app-page-layout title="FP-Growth Tree">
  <div class="flex gap-4 items-start">
    @if (transactions) {
      <app-sidebar-panel>
        <h2 class="text-lg font-semibold text-primary-700 mb-2">Transactions</h2>
        
        @for (tx of transactions; track $index; let i = $index) {
          <div class="flex gap-2 items-center w-full">
            <input
              type="text"
              placeholder="Itemset"
              [(ngModel)]="tx.items"
              class="flex-1 min-w-0 px-3 py-2 text-box bg-primary-400 text-white hover:bg-primary-500"
            />
            <input
              type="number"
              min="1"
              placeholder="Count"
              [(ngModel)]="tx.count"
              class="w-16 px-3 py-2 text-box bg-primary-400 text-white hover:bg-primary-500"
            />
            <button
              (click)="onRemoveTransaction(i)"
              class="pale-button font-bold px-2 shrink-0"
              title="Remove"
            >
              &times;
            </button>
          </div>
        }

        <button
          (click)="onAddTransaction()"
          class="pale-button text-white bg-green-600 hover:bg-green-700 px-4 py-2 rounded mt-2 w-full"
        >
          + Add Transaction
        </button>
        
        <button
          (click)="onUpdateTree()"
          class="pale-button text-white bg-blue-600 hover:bg-blue-700 px-4 py-3 rounded mt-4 w-full"
        >
          Draw Tree
        </button>
      </app-sidebar-panel>
    }

    <!-- Tree Area -->
    <div
      #treeArea
      class="relative w-[640px] h-[640px] border-2 border-primary-500 bg-primary-50 rounded-lg z-2 overflow-hidden shadow"
    ></div>
  </div>
</app-page-layout>
