<form (ngSubmit)="onRegister()" class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-lg border border-primary-300 mt-10 space-y-5">
  <h2 class="text-2xl font-bold text-primary-700 text-center">Create Account</h2>

  <div class="space-y-2">
    <label for="username" class="block text-sm font-medium text-primary-800">Username</label>
    <input
      id="username"
      type="text"
      [(ngModel)]="registerData.username"
      name="username"
      placeholder="Choose a username"
      required
      class="w-full px-3 py-2 border border-primary-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
    />
  </div>

  <div class="space-y-2">
    <label for="email" class="block text-sm font-medium text-primary-800">Email</label>
    <input
      id="email"
      type="email"
      [(ngModel)]="registerData.email"
      name="email"
      placeholder="Enter your email"
      required
      class="w-full px-3 py-2 border border-primary-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
    />
  </div>

  <div class="space-y-2">
    <label for="password" class="block text-sm font-medium text-primary-800">Password</label>
    <input
      id="password"
      type="password"
      [(ngModel)]="registerData.password"
      name="password"
      placeholder="Create a password"
      required
      class="w-full px-3 py-2 border border-primary-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
    />
  </div>

  <div class="space-y-2">
    <label for="phone" class="block text-sm font-medium text-primary-800">Phone Number (Optional)</label>
    <input
      id="phone"
      type="tel"
      [(ngModel)]="registerData.phone_number"
      name="phone_number"
      placeholder="Your phone number"
      class="w-full px-3 py-2 border border-primary-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
    />
  </div>

  <div class="space-y-2">
    <label for="theme" class="block text-sm font-medium text-primary-800">Preferred Theme</label>
    <select
      id="theme"
      [(ngModel)]="registerData.preferred_theme"
      name="theme"
      class="w-full px-3 py-2 border border-primary-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 bg-white"
    >
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </div>

  <button
    type="submit"
    [disabled]="isLoading() || isGuestLoading()"
    class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2 px-4 rounded-md transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{ isLoading() ? 'Creating Account...' : 'Register' }}
  </button>

  <div class="relative flex items-center justify-center">
    <div class="border-t border-primary-200 w-full"></div>
    <span class="bg-white px-3 text-xs font-medium text-primary-500 uppercase">or</span>
    <div class="border-t border-primary-200 w-full"></div>
  </div>

  <button
    type="button"
    (click)="onContinueAsGuest()"
    [disabled]="isLoading() || isGuestLoading()"
    class="w-full border-2 border-primary-400 bg-primary-50 hover:bg-primary-100 text-primary-700 font-semibold py-2 px-4 rounded-md transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{ isGuestLoading() ? 'Starting Guest Session...' : 'Continue as Guest' }}
  </button>

  <div *ngIf="errorMessage" class="p-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-md">
    {{ errorMessage }}
  </div>

  <div class="text-center text-sm text-primary-700">
    <p>
      Already have an account?
      <a
        routerLink="/login"
        [queryParams]="returnUrl !== '/home' ? { returnUrl } : null"
        class="font-semibold text-primary-600 hover:text-primary-800 underline"
      >
        Login here
      </a>
    </p>
  </div>
</form>
