<form (ngSubmit)="onLogin()" class="max-w-md mx-auto p-6 bg-white rounded-xl shadow-lg border border-primary-300 mt-10 space-y-5">
  <div class="text-center space-y-1">
    <h2 class="text-2xl font-bold text-primary-700">Sign In</h2>
    <p class="text-xs text-primary-600">Access your saved visualizations and account</p>
  </div>

  @if (infoMessage) {
    <div class="p-3 text-xs font-medium text-primary-800 bg-primary-100 border border-primary-300 rounded-md">
      {{ infoMessage }}
    </div>
  }

  <div class="space-y-2">
    <label for="email" class="block text-sm font-medium text-primary-800">Email</label>
    <input
      id="email"
      type="email"
      [(ngModel)]="loginData.email"
      name="email"
      placeholder="Enter your email"
      required
      class="w-full px-3 py-2 border border-primary-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
    />
  </div>

  <div class="space-y-2">
    <label for="password" class="block text-sm font-medium text-primary-800">Password</label>
    <input
      id="password"
      type="password"
      [(ngModel)]="loginData.password"
      name="password"
      placeholder="Enter your password"
      required
      class="w-full px-3 py-2 border border-primary-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
    />
  </div>

  <button
    type="submit"
    [disabled]="isLoading() || isGuestLoading()"
    class="w-full bg-primary-600 hover:bg-primary-700 text-white font-semibold py-2 px-4 rounded-md transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{ isLoading() ? 'Logging in...' : 'Login' }}
  </button>

  <div class="relative flex items-center justify-center">
    <div class="border-t border-primary-200 w-full"></div>
    <span class="bg-white px-3 text-xs font-medium text-primary-500 uppercase">or</span>
    <div class="border-t border-primary-200 w-full"></div>
  </div>

  <button
    type="button"
    (click)="onContinueAsGuest()"
    [disabled]="isLoading() || isGuestLoading()"
    class="w-full border-2 border-primary-400 bg-primary-50 hover:bg-primary-100 text-primary-700 font-semibold py-2 px-4 rounded-md transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
  >
    {{ isGuestLoading() ? 'Starting Guest Session...' : 'Continue as Guest' }}
  </button>

  <p class="text-center text-[11px] text-primary-600">
    Explore all interactive visualizations without an account. Saving requires sign in.
  </p>

  <div *ngIf="errorMessage" class="p-3 text-sm text-red-700 bg-red-50 border border-red-200 rounded-md">
    {{ errorMessage }}
  </div>

  <div class="text-center text-sm text-primary-700 pt-1">
    <p>
      Don't have an account?
      <a
        routerLink="/register"
        [queryParams]="returnUrl !== '/home' ? { returnUrl } : null"
        class="font-semibold text-primary-600 hover:text-primary-800 underline"
      >
        Register here
      </a>
    </p>
  </div>
</form>
