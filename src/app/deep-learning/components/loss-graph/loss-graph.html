<div
  class="bg-primary-50 border-2 border-primary-300 rounded-lg shadow p-4 overflow-hidden"
  #graphContainer
>
  <div class="flex justify-between items-center mb-3">
    <h3 class="text-sm font-bold text-primary-700">
      Loss Over Time
    </h3>
    @if (currentLoss() > 0) {
      <span
        class="px-2.5 py-0.5 bg-white/80 border border-primary-300 rounded text-xs font-bold text-primary-800 shadow-sm"
      >
        MSE: {{ currentLoss().toFixed(6) }}
      </span>
    }
  </div>

  <svg #graphSvg [attr.width]="graphWidth()" [attr.height]="graphHeight()" class="block w-full">
    <!-- Grid lines -->
    @for (tick of yTicks(); track tick) {
      <svg:line
        [attr.x1]="marginLeft"
        [attr.y1]="scaleY(tick)"
        [attr.x2]="graphWidth() - marginRight"
        [attr.y2]="scaleY(tick)"
        stroke="var(--color-primary-200)"
        stroke-width="1"
      />
      <svg:text
        [attr.x]="marginLeft - 6"
        [attr.y]="scaleY(tick)"
        text-anchor="end"
        dominant-baseline="middle"
        fill="var(--color-primary-600)"
        font-size="10"
        font-weight="600"
        class="select-none"
      >
        {{ formatTick(tick) }}
      </svg:text>
    }

    <!-- X-axis labels -->
    @for (tick of xTicks(); track tick) {
      <svg:text
        [attr.x]="scaleX(tick)"
        [attr.y]="graphHeight() - marginBottom + 14"
        text-anchor="middle"
        fill="var(--color-primary-600)"
        font-size="10"
        font-weight="600"
        class="select-none"
      >
        {{ tick }}
      </svg:text>
    }

    <!-- Empty state helper -->
    @if (lossHistory().length === 0) {
      <svg:text
        [attr.x]="(graphWidth() + marginLeft - marginRight) / 2"
        [attr.y]="(graphHeight() - marginBottom + marginTop) / 2"
        text-anchor="middle"
        dominant-baseline="middle"
        fill="var(--color-primary-500)"
        font-size="11"
        font-weight="600"
        class="select-none"
      >
        Run a train step to plot MSE loss
      </svg:text>
    }

    <!-- Loss line -->
    @if (pathData()) {
      <!-- Gradient fill under the line -->
      <svg:path
        [attr.d]="areaData()"
        fill="url(#areaGradient)"
        class="loss-area"
      />

      <svg:path
        [attr.d]="pathData()"
        fill="none"
        stroke="url(#lossGradient)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="loss-line"
      />
    }

    <!-- Current value dot -->
    @if (lossHistory().length > 0) {
      <svg:circle
        [attr.cx]="scaleX(lossHistory().length - 1)"
        [attr.cy]="scaleY(lossHistory()[lossHistory().length - 1])"
        r="4"
        fill="var(--color-primary-600)"
        stroke="#ffffff"
        stroke-width="2"
        class="current-dot"
      />
    }

    <!-- Gradient definitions -->
    <svg:defs>
      <svg:linearGradient id="lossGradient" x1="0" y1="0" x2="1" y2="0">
        <svg:stop offset="0%" stop-color="var(--color-primary-500)" />
        <svg:stop offset="100%" stop-color="var(--color-primary-700)" />
      </svg:linearGradient>
      <svg:linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
        <svg:stop offset="0%" stop-color="var(--color-primary-400)" stop-opacity="0.35" />
        <svg:stop offset="100%" stop-color="var(--color-primary-400)" stop-opacity="0.02" />
      </svg:linearGradient>
    </svg:defs>
  </svg>
</div>
