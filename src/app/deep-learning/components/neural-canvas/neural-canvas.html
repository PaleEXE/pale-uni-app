<div
  class="relative w-full h-full min-h-[420px] overflow-hidden rounded-lg bg-primary-50 border-2 border-primary-500 shadow select-none"
  #canvasContainer
>
  <!-- SVG Network Visualization -->
  <svg
    [attr.width]="canvasWidth()"
    [attr.height]="canvasHeight()"
    class="block w-full h-full"
    (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()"
  >
    <!-- Background grid -->
    <svg:defs>
      <svg:pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <svg:path
          d="M 40 0 L 0 0 0 40"
          fill="none"
          stroke="var(--color-primary-200)"
          stroke-opacity="0.7"
          stroke-width="1"
        />
      </svg:pattern>
    </svg:defs>
    <svg:rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Layer labels -->
    @for (label of layerLabels(); track label.x) {
      <svg:text
        [attr.x]="label.x"
        y="28"
        text-anchor="middle"
        fill="var(--color-primary-700)"
        font-size="11"
        font-weight="700"
        class="select-none"
      >
        {{ label.text }}
      </svg:text>
    }

    <!-- Connections (rendered behind neurons) -->
    @for (conn of connectionPositions(); track conn.connection.id) {
      <svg:g
        appConnection
        [connection]="conn.connection"
        [x1]="conn.x1"
        [y1]="conn.y1"
        [x2]="conn.x2"
        [y2]="conn.y2"
        [showWeight]="displayMode() === 'advanced'"
        [showParticle]="conn.animating"
        [particleProgress]="conn.particleProgress"
        (mouseenter)="onConnectionHover($event, conn.connection)"
        (mouseleave)="onConnectionLeave()"
      />
    }

    <!-- Neurons -->
    @for (pos of neuronPositions(); track pos.neuron.id) {
      <svg:g
        appNeuron
        [neuron]="pos.neuron"
        [x]="pos.x"
        [y]="pos.y"
        [showLabel]="true"
        (mouseenter)="onNeuronHover($event, pos.neuron)"
        (mouseleave)="onNeuronLeave()"
        (mousedown)="onNeuronDragStart($event, pos.neuron)"
        (click)="onNeuronClick(pos.neuron)"
      />
    }
  </svg>

  <!-- Canvas Legend (bottom-left) -->
  <div
    class="absolute bottom-2.5 left-2.5 flex items-center gap-3 px-2.5 py-1 bg-white/85 border border-primary-300 text-primary-800 text-[10px] font-semibold rounded shadow-sm pointer-events-none"
  >
    <span class="inline-flex items-center gap-1.5">
      <span class="inline-block w-4 h-0.5 bg-primary-500 rounded"></span>
      <span>Weight +</span>
    </span>
    <span class="inline-flex items-center gap-1.5">
      <span class="inline-block w-4 border-t-2 border-dashed border-primary-900"></span>
      <span>Weight −</span>
    </span>
  </div>

  <!-- Keyboard Shortcuts Hint (bottom-right) -->
  <div
    class="hidden sm:flex absolute bottom-2.5 right-2.5 items-center gap-2 px-2.5 py-1 bg-white/85 border border-primary-300 text-primary-700 text-[10px] font-medium rounded shadow-sm pointer-events-none"
  >
    <span><strong class="text-primary-900">Space</strong> Train</span>
    <span class="text-primary-300">|</span>
    <span><strong class="text-primary-900">F</strong> Forward</span>
    <span class="text-primary-300">|</span>
    <span><strong class="text-primary-900">A</strong> Auto</span>
    <span class="text-primary-300">|</span>
    <span><strong class="text-primary-900">R</strong> Reset</span>
    <span class="text-primary-300">|</span>
    <span><strong class="text-primary-900">M</strong> Mode</span>
  </div>

  <!-- Tooltip overlay -->
  <app-tooltip
    [visible]="tooltipVisible()"
    [posX]="tooltipX()"
    [posY]="tooltipY()"
    [title]="tooltipTitle()"
    [items]="tooltipItems()"
    [formula]="tooltipFormula()"
  />
</div>
